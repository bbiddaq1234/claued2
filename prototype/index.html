<title>발행 관제실</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ── 토큰 ─────────────────────────────────────────────────────── */
  :root {
    --ink: #f3f1ea;
    --panel: #ffffff;
    --panel-raised: #f7f4ec;
    --line: #ded7c4;
    --paper: #fbf8f0;
    --paper-ink: #29241a;
    --paper-line: #e2d9c2;
    --text: #241f16;
    --text-dim: #6e6656;
    --accent: #2f6f8f;
    --accent-ink: #1c4a63;
    --safe: #2f8f5f;
    --live: #b4791a;
    --armed: #b23f33;
    --shadow: rgba(41, 33, 15, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #12151c;
      --panel: #191d27;
      --panel-raised: #212635;
      --line: #2b3142;
      --paper: #f4efe2;
      --paper-ink: #2a2318;
      --paper-line: #ddd2b2;
      --text: #e7e5df;
      --text-dim: #9099ac;
      --accent: #6fb1d6;
      --accent-ink: #17313f;
      --safe: #58bd8c;
      --live: #e0b23c;
      --armed: #e1594c;
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --ink: #12151c;
    --panel: #191d27;
    --panel-raised: #212635;
    --line: #2b3142;
    --paper: #f4efe2;
    --paper-ink: #2a2318;
    --paper-line: #ddd2b2;
    --text: #e7e5df;
    --text-dim: #9099ac;
    --accent: #6fb1d6;
    --accent-ink: #17313f;
    --safe: #58bd8c;
    --live: #e0b23c;
    --armed: #e1594c;
    --shadow: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  ::selection { background: var(--accent); color: var(--panel); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ── 프로토타입 표식 ──────────────────────────────────────────── */
  .proto-flag {
    position: sticky; top: 0; z-index: 30;
    background: var(--panel-raised);
    border-bottom: 1px solid var(--line);
    padding: 7px 20px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex; align-items: center; gap: 8px;
  }
  .proto-flag b { color: var(--text); font-weight: 600; }
  .proto-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex-shrink: 0; }

  /* ── 상태 레일 ────────────────────────────────────────────────── */
  .rail {
    position: sticky; top: 29px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-raised);
    transition: background 0.3s ease;
  }
  .rail[data-tone="safe"] { background: color-mix(in srgb, var(--safe) 16%, var(--panel-raised)); }
  .rail[data-tone="armed"] { background: color-mix(in srgb, var(--armed) 18%, var(--panel-raised)); }
  .rail-text { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .rail-text small { display: block; font-weight: 400; color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .rail-right { display: flex; align-items: center; gap: 16px; }
  .dot-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 0 3px color-mix(in srgb, var(--safe) 20%, transparent); }

  /* ── 레이아웃 ─────────────────────────────────────────────────── */
  .shell {
    max-width: 1180px; margin: 0 auto;
    padding: 24px 20px 90px;
    display: grid;
    grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
  }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  /* ── 카드 ─────────────────────────────────────────────────────── */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .card > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin-bottom: 14px; font-weight: 600;
  }

  /* ── 계량기 ───────────────────────────────────────────────────── */
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .meter { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 2px var(--shadow); }
  .meter-num { font-size: 21px; font-weight: 700; font-family: "IBM Plex Mono", monospace; letter-spacing: -0.02em; }
  .meter-label { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .meter-bar { height: 5px; border-radius: 99px; background: var(--panel-raised); margin: 9px 0 6px; overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 99px; background: var(--safe); transition: width 0.5s ease; }
  .meter-fill[data-tone="live"] { background: var(--live); }
  .meter-fill[data-tone="armed"] { background: var(--armed); }
  .meter-sub { font-size: 11px; color: var(--text-dim); }

  /* ── 유형 카드 ────────────────────────────────────────────────── */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .mode-btn {
    text-align: left; background: var(--panel-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 11px; display: flex; flex-direction: column; gap: 3px;
  }
  .mode-btn b { font-size: 12.5px; }
  .mode-btn span { font-size: 10.5px; color: var(--text-dim); line-height: 1.35; }
  .mode-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  /* ── 필드 ─────────────────────────────────────────────────────── */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; font-size: 13px; }
  .field > span { color: var(--text-dim); font-size: 12px; }
  .field input, .field select, .field textarea {
    background: var(--panel-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; font-size: 13.5px;
  }
  .field textarea { resize: vertical; font-family: inherit; }
  .field-row { display: flex; gap: 8px; }
  .field-row input { flex: 1; min-width: 0; }
  .hint { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .btn {
    background: var(--panel-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 13px; font-size: 13px; font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary {
    width: 100%; background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-weight: 700; padding: 12px; font-size: 14px; border-radius: 9px; margin-top: 4px;
  }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost { background: transparent; }

  .badge { display: inline-block; border-radius: 7px; padding: 6px 9px; font-size: 12px; margin-top: 8px; }
  .badge-warn { background: color-mix(in srgb, var(--armed) 16%, transparent); border: 1px solid color-mix(in srgb, var(--armed) 45%, transparent); }

  /* ── 설정 (인라인, 서랍 아님) ─────────────────────────────────── */
  .settings-toggle {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: transparent; border: 0; padding: 0; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim); font-weight: 600; margin-bottom: 4px;
  }
  .settings-body { display: grid; gap: 11px; overflow: hidden; max-height: 0; transition: max-height 0.35s ease; }
  .settings-body.open { max-height: 800px; padding-top: 14px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
  .toggle-row p { font-size: 11px; color: var(--text-dim); margin: 2px 0 0; }
  .switch { width: 36px; height: 20px; border-radius: 99px; background: var(--panel-raised); border: 1px solid var(--line); position: relative; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-dim); transition: left 0.15s ease, background 0.15s ease; }
  .switch[aria-checked="true"] { background: var(--safe); border-color: var(--safe); }
  .switch[aria-checked="true"]::after { left: 18px; background: var(--panel); }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ── 최근 작업 ────────────────────────────────────────────────── */
  .job-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .job-row {
    width: 100%; text-align: left; background: var(--panel-raised); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 11px; display: flex; flex-direction: column; gap: 3px;
  }
  .job-row[aria-current="true"] { border-color: var(--accent); }
  .job-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .job-kw { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-stat { font-size: 10.5px; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
  .job-stat[data-s="done"] { background: color-mix(in srgb, var(--safe) 22%, transparent); color: var(--safe); }
  .job-stat[data-s="live"] { background: color-mix(in srgb, var(--live) 24%, transparent); color: var(--live); }
  .job-stat[data-s="run"] { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .job-meta { font-size: 10.5px; color: var(--text-dim); }

  /* ── 우측: 원고지(종이) 프레임 ────────────────────────────────── */
  .paper-frame {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; box-shadow: 0 2px 10px var(--shadow);
    display: flex; flex-direction: column; min-height: 560px;
  }
  .paper-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel-raised);
  }
  .paper-head h2 { font-size: 13px; font-weight: 600; }
  .paper-head .stamp { font-size: 10.5px; color: var(--text-dim); font-family: "IBM Plex Mono", monospace; }

  .console {
    background: color-mix(in srgb, var(--ink) 92%, black 8%);
    color: #d7e6df;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    padding: 0 18px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.4s ease;
    border-bottom: 1px solid var(--line);
  }
  .console.open { max-height: 220px; padding: 14px 18px; overflow-y: auto; }
  .console p { margin: 0 0 6px; opacity: 0; transform: translateY(4px); animation: rise 0.3s ease forwards; }
  .console p.warn { color: #f0c869; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .paper {
    background: var(--paper); color: var(--paper-ink);
    flex: 1; padding: 34px 40px 44px;
    font-family: "Noto Serif KR", serif;
  }
  .paper-empty { color: color-mix(in srgb, var(--paper-ink) 55%, transparent); font-family: "IBM Plex Sans KR", sans-serif; font-size: 13.5px; padding-top: 40px; text-align: center; }
  .paper-title { font-size: 23px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; text-wrap: balance; }
  .paper-byline { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: color-mix(in srgb, var(--paper-ink) 55%, transparent); margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--paper-line); }
  .paper h3 { font-size: 16px; font-weight: 700; margin: 22px 0 8px; }
  .paper .pquote { font-size: 15px; font-weight: 600; border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; margin: 18px 0; color: color-mix(in srgb, var(--paper-ink) 88%, var(--accent) 12%); }
  .paper p { font-size: 14.5px; line-height: 1.9; margin: 0 0 14px; max-width: 62ch; }
  .paper mark { background: color-mix(in srgb, var(--live) 55%, var(--paper) 45%); color: var(--paper-ink); padding: 0 3px; border-radius: 2px; }
  .paper hr { border: 0; border-top: 1px dashed var(--paper-line); margin: 24px 0; }
  .photo-slot {
    height: 150px; border-radius: 8px; margin: 16px 0;
    background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--paper)), color-mix(in srgb, var(--accent) 16%, var(--paper)) 10px, color-mix(in srgb, var(--accent) 9%, var(--paper)) 10px, color-mix(in srgb, var(--accent) 9%, var(--paper)) 20px);
    border: 1px solid var(--paper-line);
    display: flex; align-items: flex-end; padding: 8px 10px;
  }
  .photo-slot span { font-family: "IBM Plex Sans KR", sans-serif; font-size: 10.5px; background: color-mix(in srgb, var(--paper) 80%, black 5%); padding: 3px 7px; border-radius: 5px; color: color-mix(in srgb, var(--paper-ink) 75%, transparent); }

  .paper-result { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--paper-line); font-family: "IBM Plex Sans KR", sans-serif; font-size: 13px; }
  .result-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .result-pill.live { background: color-mix(in srgb, var(--armed) 18%, var(--paper)); color: var(--armed); }
  .result-pill.safe { background: color-mix(in srgb, var(--safe) 18%, var(--paper)); color: var(--safe); }
  .result-url { display: block; margin-top: 8px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--accent); word-break: break-all; }
</style>

<div class="proto-flag">
  <span class="proto-dot"></span>
  <b>웹 프로토타입</b> — 실제 네이버 로그인·발행·AI 호출은 일어나지 않습니다. 흐름과 화면 구성을 미리 보여드리기 위한 시뮬레이션입니다.
</div>

<header class="rail" id="rail" data-tone="safe">
  <div class="rail-text" id="railText">
    연습 모드 <small>발행하지 않고 완성 화면만 저장합니다</small>
  </div>
  <div class="rail-right">
    <span class="dot-wrap"><span class="dot"></span>Claude</span>
    <span class="dot-wrap"><span class="dot"></span>네이버</span>
    <span class="dot-wrap"><span class="dot"></span>이미지 생성</span>
  </div>
</header>

<main class="shell">
  <div class="col">
    <div class="meters">
      <div class="meter">
        <div class="meter-num" id="mPublish">0 / 3편</div>
        <div class="meter-label">오늘 발행</div>
        <div class="meter-bar"><div class="meter-fill" id="mPublishBar" data-tone="safe" style="width:0%"></div></div>
        <div class="meter-sub">발행 간격 30분</div>
      </div>
      <div class="meter">
        <div class="meter-num" id="mNeuron">0 / 10,000</div>
        <div class="meter-label">이미지 생성량(뉴런)</div>
        <div class="meter-bar"><div class="meter-fill" id="mNeuronBar" data-tone="safe" style="width:0%"></div></div>
        <div class="meter-sub">추정 · 장당 250 뉴런</div>
      </div>
    </div>

    <section class="card">
      <h2>새로 쓰기</h2>
      <div class="mode-grid" id="modeGrid">
        <button class="mode-btn" data-mode="auto" aria-pressed="true">
          <b>자동 발굴</b><span>키워드만 넣으면 글감부터 골라 씁니다</span>
        </button>
        <button class="mode-btn" data-mode="experience" aria-pressed="false">
          <b>체험단</b><span>방문 후기를 1인칭으로 씁니다</span>
        </button>
        <button class="mode-btn" data-mode="branding" aria-pressed="false">
          <b>브랜딩·전문성</b><span>전문가 포지셔닝 글을 씁니다</span>
        </button>
      </div>

      <div id="fieldsAuto">
        <label class="field">
          <span>관심 키워드</span>
          <input id="keyword" value="가을 제주 감귤밭 카페" />
        </label>
      </div>
      <div id="fieldsManual" style="display:none">
        <label class="field">
          <span>주제</span>
          <input id="topic" value="연남동 조용한 북카페" />
        </label>
        <label class="field">
          <span>핵심 내용</span>
          <textarea id="keyContent" rows="3">이름: 책방골목 / 위치: 연남동 / 가격: 아메리카노 5,000원 / 특징: 반려동물 동반 가능</textarea>
        </label>
      </div>

      <label class="field">
        <span>사진</span>
        <select id="photoSource">
          <option value="none">없음</option>
          <option value="crawl" selected>검색 크롤링</option>
          <option value="ai">AI 생성</option>
        </select>
      </label>

      <button class="btn-primary" id="genBtn">연습으로 만들기</button>
      <p class="hint" id="genHint"></p>
    </section>

    <section class="card">
      <button class="settings-toggle" id="settingsToggle" aria-expanded="false">
        <span>설정</span><span id="settingsChevron">▾</span>
      </button>
      <div class="settings-body" id="settingsBody">
        <div class="toggle-row">
          <div><div>연습 모드</div><p>꺼두면 실제로 발행됩니다</p></div>
          <button class="switch" id="swDryRun" role="switch" aria-checked="false"></button>
        </div>
        <div class="toggle-row">
          <div><div>전체 중단</div><p>켜면 어떤 작업도 발행되지 않습니다</p></div>
          <button class="switch" id="swKill" role="switch" aria-checked="false"></button>
        </div>
        <label class="field">
          <span>공개 범위</span>
          <select id="visibility">
            <option value="private" selected>비공개(권장)</option>
            <option value="both">서로이웃공개</option>
            <option value="neighbor">이웃공개</option>
            <option value="public">전체공개</option>
          </select>
        </label>
        <div class="settings-grid">
          <label class="field">
            <span>하루 발행 수</span>
            <input id="dailyLimit" type="number" value="3" min="1" max="50" />
          </label>
          <label class="field">
            <span>이미지 후보</span>
            <input id="imgCandidates" type="number" value="10" min="3" max="20" />
          </label>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>최근 작업</h2>
      <div class="job-list" id="jobList"></div>
    </section>
  </div>

  <div class="col">
    <div class="paper-frame">
      <div class="paper-head">
        <h2 id="paperHeadTitle">완성 화면 미리보기</h2>
        <span class="stamp" id="paperStamp">예시 · sample-001</span>
      </div>
      <div class="console" id="console"></div>
      <div class="paper" id="paper"></div>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";

  // ── 상태 ────────────────────────────────────────────────────────
  var state = {
    mode: "auto",
    dryRun: false,
    killSwitch: false,
    publishedToday: 0,
    neuronsToday: 0,
    jobs: [],
    selectedId: null,
    generating: false,
  };

  var $ = function (id) { return document.getElementById(id); };

  // ── 예시로 미리 채워두는 최근 작업(빈 화면 대신 실제로 있어 보이는 상태) ──
  var SAMPLE_DRAFTS = {
    seed1: {
      keyword: "홈카페 원두 고르는 법",
      mode: "auto",
      status: "done",
      when: "어제",
      title: "산미냐 고소함이냐, 홈카페 원두 고르는 법 총정리",
      sections: [
        { t: "h", v: "요즘 원두, 뭐가 다른 걸까" },
        { t: "p", v: "카페인 줄이려고 홈카페를 시작했다가 원두 앞에서 매번 멈칫하셨다면, 오늘 글이 도움이 될 거예요. 산미와 로스팅 단계만 구분해도 선택이 훨씬 쉬워집니다." },
        { t: "q", v: "라벨의 '중배전'이라는 말, 사실 절반의 정보밖에 안 됩니다" },
        { t: "p", v: "로스팅 단계는 쓴맛과 신맛의 균형을 정하지만, ", h: "원두의 품종과 가공 방식이 향의 8할을 결정", after: " 합니다. 워시드 가공은 깔끔한 산미, 내추럴 가공은 묵직한 단맛에 가깝다고 보시면 됩니다." },
        { t: "img", v: "핸드드립 도구와 원두 봉투 클로즈업" },
        { t: "p", v: "결론적으로 처음이라면 워시드 중배전 한 봉지로 시작해서, 입맛에 따라 로스팅 단계를 한 칸씩 옮겨보시는 걸 추천합니다." },
      ],
    },
    seed2: {
      keyword: "연남동 북카페",
      mode: "experience",
      status: "done",
      when: "3일 전",
      title: "연남동 책방골목, 반려동물과 함께한 반나절",
      sections: [
        { t: "q", v: "예약 없이 갔다가 웨이팅 30분" },
        { t: "p", v: "평일 오후인데도 자리가 꽉 차 있더라구요. 다행히 창가 자리가 하나 비어서 강아지 데리고 앉을 수 있었어요." },
        { t: "img", v: "창가 자리에서 찍은 사진" },
        { t: "p", v: "아메리카노는 5,000원, 디저트류는 7~9천원대예요. 가격은 평범한데 자리 회전이 느려서 그런지 앉아있기 참 편했습니다." },
        { t: "p", v: "다시 간다면 평일 오전에 가서 창가 자리부터 맡을 것 같아요. 반려동물 동반 가능한 건 확인하고 가시는 걸 추천드려요." },
      ],
    },
  };

  function seedJobs() {
    Object.keys(SAMPLE_DRAFTS).forEach(function (id) {
      var d = SAMPLE_DRAFTS[id];
      state.jobs.push({
        id: id,
        keyword: d.keyword,
        mode: d.mode,
        status: "done",
        when: d.when,
        draft: d,
        published: d.mode === "experience",
      });
    });
    state.publishedToday = 1;
    state.neuronsToday = 480;
  }

  // ── 상태 레일 ───────────────────────────────────────────────────
  function renderRail() {
    var rail = $("rail"), text = $("railText");
    if (state.killSwitch) {
      rail.dataset.tone = "armed";
      text.innerHTML = "전체 중단 <small>어떤 작업도 발행되지 않습니다</small>";
    } else if (state.dryRun) {
      rail.dataset.tone = "safe";
      text.innerHTML = "연습 모드 <small>발행하지 않고 완성 화면만 저장합니다</small>";
    } else {
      rail.dataset.tone = "armed";
      text.innerHTML = "실제 발행 <small>완성되는 글이 블로그에 그대로 올라갑니다</small>";
    }
    var btn = $("genBtn");
    btn.textContent = state.killSwitch ? "전체 중단 중" : (state.generating ? "만드는 중..." : (state.dryRun ? "연습으로 만들기" : "글 만들고 발행하기"));
    btn.disabled = state.killSwitch || state.generating;
  }

  // ── 계량기 ──────────────────────────────────────────────────────
  function renderMeters() {
    var limit = Number($("dailyLimit").value) || 3;
    var pPct = Math.min(100, (state.publishedToday / limit) * 100);
    $("mPublish").textContent = state.publishedToday + " / " + limit + "편";
    var pBar = $("mPublishBar");
    pBar.style.width = pPct + "%";
    pBar.dataset.tone = pPct >= 90 ? "armed" : pPct >= 70 ? "live" : "safe";

    var nPct = Math.min(100, (state.neuronsToday / 10000) * 100);
    $("mNeuron").textContent = state.neuronsToday.toLocaleString() + " / 10,000";
    var nBar = $("mNeuronBar");
    nBar.style.width = nPct + "%";
    nBar.dataset.tone = nPct >= 90 ? "armed" : nPct >= 70 ? "live" : "safe";
  }

  // ── 유형 전환 ───────────────────────────────────────────────────
  document.querySelectorAll(".mode-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.mode = btn.dataset.mode;
      document.querySelectorAll(".mode-btn").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
      $("fieldsAuto").style.display = state.mode === "auto" ? "" : "none";
      $("fieldsManual").style.display = state.mode === "auto" ? "none" : "";
    });
  });

  // ── 설정 토글 ───────────────────────────────────────────────────
  $("settingsToggle").addEventListener("click", function () {
    var body = $("settingsBody");
    var open = body.classList.toggle("open");
    $("settingsToggle").setAttribute("aria-expanded", String(open));
    $("settingsChevron").textContent = open ? "▴" : "▾";
  });

  function wireSwitch(id, onChange) {
    var el = $(id);
    el.addEventListener("click", function () {
      var next = el.getAttribute("aria-checked") !== "true";
      el.setAttribute("aria-checked", String(next));
      onChange(next);
    });
  }
  wireSwitch("swDryRun", function (v) { state.dryRun = v; renderRail(); });
  wireSwitch("swKill", function (v) { state.killSwitch = v; renderRail(); });
  $("dailyLimit").addEventListener("input", renderMeters);

  // ── 최근 작업 목록 ──────────────────────────────────────────────
  function renderJobList() {
    var list = $("jobList");
    list.innerHTML = "";
    state.jobs.forEach(function (job) {
      var row = document.createElement("button");
      row.className = "job-row";
      row.setAttribute("aria-current", String(job.id === state.selectedId));
      var statusLabel = job.status === "run" ? "만드는 중" : (job.published ? "발행됨" : "연습 완료");
      var statusKey = job.status === "run" ? "run" : (job.published ? "live" : "done");
      row.innerHTML =
        '<div class="job-row-top"><span class="job-kw"></span><span class="job-stat" data-s="' + statusKey + '"></span></div>' +
        '<span class="job-meta"></span>';
      row.querySelector(".job-kw").textContent = job.keyword;
      row.querySelector(".job-stat").textContent = statusLabel;
      row.querySelector(".job-meta").textContent = MODE_LABEL[job.mode] + " · " + job.when;
      row.addEventListener("click", function () {
        if (job.status === "run") return;
        state.selectedId = job.id;
        renderJobList();
        renderPaper(job);
      });
      list.appendChild(row);
    });
  }

  var MODE_LABEL = { auto: "자동 발굴", experience: "체험단", branding: "브랜딩·전문성" };

  // ── 원고지(결과) 렌더 ───────────────────────────────────────────
  function sectionsToHtml(sections) {
    return sections.map(function (s) {
      if (s.t === "h") return "<h3>" + escapeHtml(s.v) + "</h3>";
      if (s.t === "q") return '<p class="pquote">' + escapeHtml(s.v) + "</p>";
      if (s.t === "hr") return "<hr>";
      if (s.t === "img") return '<div class="photo-slot"><span>' + escapeHtml(s.v) + "</span></div>";
      if (s.t === "p") {
        if (s.h) {
          return "<p>" + escapeHtml(s.v) + "<mark>" + escapeHtml(s.h) + "</mark>" + escapeHtml(s.after || "") + "</p>";
        }
        return "<p>" + escapeHtml(s.v) + "</p>";
      }
      return "";
    }).join("");
  }
  function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function renderPaper(job) {
    $("paperHeadTitle").textContent = job.status === "run" ? "만드는 중" : "완성 화면";
    $("paperStamp").textContent = (job.published ? "발행됨" : "예시") + " · " + job.id;
    var paper = $("paper");
    var d = job.draft;
    var resultHtml = "";
    if (job.status === "done") {
      if (job.published) {
        resultHtml =
          '<div class="paper-result"><span class="result-pill live">● 실제 발행됨</span>' +
          '<span class="result-url">blog.naver.com/example-blog/' + job.id.replace(/\D/g, "").padEnd(12, "3") + "223456789012</span></div>";
      } else {
        resultHtml = '<div class="paper-result"><span class="result-pill safe">● 연습 모드 — 실제로 올라가지 않았습니다</span></div>';
      }
    }
    paper.innerHTML =
      '<div class="paper-title">' + escapeHtml(d.title) + "</div>" +
      '<div class="paper-byline">' + MODE_LABEL[job.mode] + " · " + escapeHtml(job.keyword) + "</div>" +
      sectionsToHtml(d.sections) +
      resultHtml;
  }

  // ── 글감/본문 생성 시뮬레이션 ───────────────────────────────────
  var TEMPLATES = {
    auto: function (kw) {
      return {
        title: '"' + kw + '"' + ", 요즘 이렇게까지 뜨는 이유",
        sections: [
          { t: "h", v: kw + "가 다시 주목받는 이유" },
          { t: "p", v: "최근 관련 글과 뉴스를 살펴보니, 단순한 유행이 아니라 계절과 맞물린 확실한 이유가 있었습니다. 오늘은 그 흐름을 정리해봤어요." },
          { t: "q", v: "핵심은 '언제, 어디서'입니다" },
          { t: "p", v: "많은 분들이 놓치는 부분인데, ", h: "타이밍만 맞으면 같은 장소도 완전히 다르게 느껴집니다", after: ". 사람이 몰리기 전 이른 시간을 노리는 걸 추천드립니다." },
          { t: "img", v: kw + " 관련 사진" },
          { t: "p", v: "정리하자면, 지금 이 시기를 놓치지 않고 한 번쯤 다녀오시길 권해드립니다. 다음 글에서는 구체적인 코스를 이어서 다뤄볼게요." },
        ],
      };
    },
    experience: function (topic, content) {
      return {
        title: topic + ", 저희가 직접 다녀와서 남기는 후기",
        sections: [
          { t: "q", v: "결론부터 말씀드리면 재방문 의사 있어요" },
          { t: "p", v: "이 글은 " + topic + "에 다녀온 뒤 남기는 솔직한 후기입니다. " + (content ? content.split("/")[0] : "") + " 정도로 알고 가시면 도움 되실 거예요." },
          { t: "img", v: "방문 당시 찍은 사진" },
          { t: "p", v: "실용정보를 간단히 정리하면, " + (content || "가격과 위치는 방문 전 미리 확인하시는 걸 추천드려요") + " 였습니다." },
          { t: "hr" },
          { t: "p", v: "총평은 만족이었고, 다시 간다면 사람 몰리는 시간대만 피해서 가려고요. 여러분도 참고하시면 좋을 것 같아요." },
        ],
      };
    },
    branding: function (topic, content) {
      return {
        title: topic + "에서 성과가 안 나는 진짜 이유",
        sections: [
          { t: "q", v: "3년간 실무에서 확인한 패턴입니다" },
          { t: "p", v: (content || topic + " 관련 실적") + "을 바탕으로 말씀드리면, 대부분의 시행착오는 같은 지점에서 반복됩니다." },
          { t: "p", v: "많은 분들이 방법을 바꾸는 대신 노력만 늘리시는데, 그게 오히려 문제를 키우는 경우가 많았습니다." },
          { t: "hr" },
          { t: "p", v: "그래서 저희 팀은 ", h: "진단 → 설계 → 실행의 3단계 프레임워크", after: "를 만들어 적용하고 있습니다. 순서를 바꾸지 않는 게 핵심입니다." },
          { t: "p", v: "지금 같은 문제로 고민 중이시라면, 댓글로 상황을 남겨주세요. 다음 글에서 실제 사례로 다뤄보겠습니다." },
        ],
      };
    },
  };

  var LOG_STEPS = {
    auto: ["뉴스·블로그를 모으는 중", "글감 5개 중 하나를 고르는 중", "본문을 쓰는 중", "사진을 구하는 중", "에디터에 작성하는 중"],
    experience: ["후기체로 본문을 쓰는 중", "사진을 배치하는 중", "에디터에 작성하는 중"],
    branding: ["구조를 잡고 본문을 쓰는 중", "사진을 구하는 중", "에디터에 작성하는 중"],
  };

  function runGenerate() {
    if (state.killSwitch || state.generating) return;
    state.generating = true;
    renderRail();

    var id = "job" + Date.now();
    var kw = state.mode === "auto" ? ($("keyword").value.trim() || "관심 키워드") : ($("topic").value.trim() || "주제");
    var placeholderJob = { id: id, keyword: kw, mode: state.mode, status: "run", when: "지금", draft: { title: "만드는 중...", sections: [] } };
    state.jobs.unshift(placeholderJob);
    state.selectedId = id;
    renderJobList();

    var consoleEl = $("console");
    consoleEl.innerHTML = "";
    consoleEl.classList.add("open");
    $("paperHeadTitle").textContent = "만드는 중";
    $("paperStamp").textContent = "job · " + id;
    $("paper").innerHTML = '<p class="paper-empty">글감을 찾고 본문을 쓰는 과정이 실시간으로 왼쪽 콘솔에 표시됩니다.</p>';

    var steps = LOG_STEPS[state.mode];
    steps.forEach(function (msg, i) {
      setTimeout(function () {
        var p = document.createElement("p");
        p.textContent = "· " + msg;
        consoleEl.appendChild(p);
        consoleEl.scrollTop = consoleEl.scrollHeight;
      }, 260 * (i + 1));
    });

    setTimeout(function () {
      var draft;
      if (state.mode === "auto") draft = TEMPLATES.auto(kw);
      else if (state.mode === "experience") draft = TEMPLATES.experience($("topic").value.trim() || "이 장소", $("keyContent").value.trim());
      else draft = TEMPLATES.branding($("topic").value.trim() || "이 분야", $("keyContent").value.trim());

      var done = document.createElement("p");
      done.textContent = state.dryRun ? "· 연습 모드 — 완성 화면만 저장했습니다" : "· 공개 범위 확인 후 발행했습니다";
      consoleEl.appendChild(done);

      var published = !state.dryRun;
      placeholderJob.status = "done";
      placeholderJob.draft = draft;
      placeholderJob.published = published;

      if (published) {
        state.publishedToday += 1;
      }
      state.neuronsToday += $("photoSource").value === "ai" ? 1500 : $("photoSource").value === "crawl" ? 0 : 0;

      renderMeters();
      renderJobList();
      renderPaper(placeholderJob);

      state.generating = false;
      renderRail();
    }, 260 * (steps.length + 1) + 250);
  }

  $("genBtn").addEventListener("click", runGenerate);

  // ── 초기화 ──────────────────────────────────────────────────────
  seedJobs();
  state.selectedId = state.jobs[0].id;
  renderRail();
  renderMeters();
  renderJobList();
  renderPaper(state.jobs[0]);
})();
</script>
